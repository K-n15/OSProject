# The one entry point of the application (the "web" service in docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Basic hardening for every response.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API requests go to the Go container. "api" is its service name; Docker's
    # internal DNS turns it into the container's address.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # the API uses this for rate limits
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;                   # 2 MB image + form fields
        proxy_read_timeout 60s;
    }

    # Built JS/CSS have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }
}
