# IT-Assist: four containers on one private Docker network.
#
#   browser ──▶ web (nginx + Vue) ──/api──▶ api (Go) ──▶ db (PostgreSQL)
#                                                     └─▶ storage (SeaweedFS, images)
#
# Only "web" is published on the host. The API, database and storage can only
# be reached from inside the network.

name: it-assist

services:
  web:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8000}:80"]
    depends_on: [api]
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://itassist:${DB_PASSWORD}@db:5432/itassist?sslmode=disable
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: itassist-attachments
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}   # 0 because the demo runs on plain http://localhost
      TRUST_PROXY: "1"                     # requests only arrive through the web container
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
    restart: unless-stopped
    stop_grace_period: 15s               # time to finish requests after SIGTERM

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: itassist
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: itassist
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro   # runs only when the volume is empty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itassist -d itassist"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:latest
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Write the S3 credentials file from .env, then start SeaweedFS (master, volume
    # server, filer and S3 gateway in one process). Keys come only from .env, so
    # they can't get out of sync with the API's.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"itassist","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging","Admin"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes: [objects:/data]
    restart: unless-stopped

volumes:
  pgdata: {}
  objects: {}
